name: Jira workflow verification

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to process
        required: true
        type: number
      target_status:
        description: Jira target status
        required: true
        type: choice
        options:
          - In Progress
          - Done
      issue_key:
        description: Factory Jira issue key for manual synchronization
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jira-workflow-${{ github.repository }}-${{ inputs.issue_key || github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  transition:
    name: Synchronize linked Jira issue
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_IN_PROGRESS_STATUS_ID: ${{ vars.JIRA_IN_PROGRESS_STATUS_ID }}
          JIRA_DONE_STATUS_ID: ${{ vars.JIRA_DONE_STATUS_ID }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -z "$JIRA_BASE_URL" || -z "$JIRA_EMAIL" || -z "$JIRA_API_TOKEN" || -z "$JIRA_IN_PROGRESS_STATUS_ID" || -z "$JIRA_DONE_STATUS_ID" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_HEAD_REF" =~ ^codex/factory/[A-Z][A-Z0-9]+-[1-9][0-9]*$ ]]; then
              echo "::error::Jira automation is not fully configured for a factory synchronization."
              exit 1
            fi
            echo "::notice::Jira automation is not configured for this non-factory pull request; skipping transition."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize linked Jira issue
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MANUAL_PR_NUMBER: ${{ inputs.pull_number }}
          MANUAL_ISSUE_KEY: ${{ inputs.issue_key }}
          MANUAL_TARGET_STATUS: ${{ inputs.target_status }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_IN_PROGRESS_STATUS_ID: ${{ vars.JIRA_IN_PROGRESS_STATUS_ID }}
          JIRA_DONE_STATUS_ID: ${{ vars.JIRA_DONE_STATUS_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$MANUAL_PR_NUMBER"
            target_status="$MANUAL_TARGET_STATUS"
          else
            pr_number="$EVENT_PR_NUMBER"
            case "$EVENT_ACTION" in
              opened|reopened|synchronize) target_status="In Progress" ;;
              closed) target_status="Done" ;;
              *) echo "No Jira transition required for this event."; exit 0 ;;
            esac
          fi

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid pull request number." >&2
            exit 1
          }

          pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json title,body,headRefName,headRefOid,headRepository,baseRefName,mergeCommit,mergedAt,state,url,number)
          base_ref=$(jq -r '.baseRefName // empty' <<<"$pr_json")
          merged_at=$(jq -r '.mergedAt // empty' <<<"$pr_json")
          pr_state=$(jq -r '.state // empty' <<<"$pr_json")
          head_repository=$(jq -r '.headRepository.nameWithOwner // empty' <<<"$pr_json")
          head_sha=$(jq -r '.headRefOid // empty' <<<"$pr_json")

          if [[ "$EVENT_NAME" != "workflow_dispatch" && ! "$EVENT_HEAD_REF" =~ ^codex/factory/[A-Z][A-Z0-9]+-[1-9][0-9]*$ ]]; then
            echo "::notice::Pull request is outside the Jira factory scope; skipping transition."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$EVENT_ACTION" == "closed" && -z "$merged_at" ]]; then
            echo "::notice::Closed pull request was not merged; no Jira transition required."
            exit 0
          fi

          case "$target_status" in
            "In Progress")
              if [[ "$pr_state" != "OPEN" || -n "$merged_at" ]]; then
                echo "::error::In Progress requires a current, unmerged open PR."
                exit 1
              fi
              ;;
            "Done")
              if [[ -z "$merged_at" || "$base_ref" != "main" && "$base_ref" != "master" ]]; then
                echo "::error::Done requires a merged PR targeting main or master."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Jira target status: $target_status"
              exit 1
              ;;
          esac

          head_ref=$(jq -r '.headRefName // empty' <<<"$pr_json")
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" || \
                ! "$head_ref" =~ ^codex/factory/([A-Z][A-Z0-9]+-[1-9][0-9]*)$ ]]; then
            echo "::error::Jira synchronization requires an authenticated canonical factory branch in this repository; found '$head_ref'."
            exit 1
          fi
          issue_key="${BASH_REMATCH[1]}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_ISSUE_KEY" != "$issue_key" ]]; then
            echo "::error::Manual issue key does not match the canonical factory branch."
            exit 1
          fi
          expected_factory_branch="codex/factory/$issue_key"
          expected_lock_branch="codex/factory-lock/$issue_key"

          claim_path=".codex/factory-claims/$issue_key.json"
          claim_ref="$head_sha"
          if [[ "$target_status" == "Done" ]]; then
            claim_ref=$(jq -r '.mergeCommit.oid // empty' <<<"$pr_json")
          fi
          [[ -n "$claim_ref" ]] || {
            echo "::error::Could not resolve an immutable pull-request commit for the factory claim."
            exit 1
          }
          claim_content=$(gh api "repos/$GITHUB_REPOSITORY/contents/$claim_path?ref=$claim_ref" --jq '.content' | tr -d '\n' | base64 --decode)
          claim_issue_key=$(jq -r '.issueKey // empty' <<<"$claim_content")
          claim_repository=$(jq -r '.repository // empty' <<<"$claim_content")
          claim_branch=$(jq -r '.branch // empty' <<<"$claim_content")
          claim_lock_branch=$(jq -r '.lockBranch // empty' <<<"$claim_content")
          claim_target_branch=$(jq -r '.targetBranch // empty' <<<"$claim_content")
          claim_run_id=$(jq -r '.runId // empty' <<<"$claim_content")
          claim_pr_number=$(jq -r '.pullRequestNumber // empty' <<<"$claim_content")
          if [[ "$claim_issue_key" != "$issue_key" || \
                "$claim_repository" != "$GITHUB_REPOSITORY" || \
                "$claim_branch" != "$head_ref" || \
                "$claim_lock_branch" != "$expected_lock_branch" || \
                "$claim_target_branch" != "$base_ref" || \
                -z "$claim_run_id" ]]; then
            echo "::error::Factory claim does not match this repository, issue, branch, target, and run."
            exit 1
          fi
          if [[ "$claim_pr_number" != "$pr_number" ]]; then
            echo "::error::Factory claim is not bound to pull request #$pr_number."
            exit 1
          fi

          active_claim_content=$(gh api "repos/$GITHUB_REPOSITORY/contents/$claim_path?ref=$expected_lock_branch" --jq '.content' | tr -d '\n' | base64 --decode)
          active_issue_key=$(jq -r '.issueKey // empty' <<<"$active_claim_content")
          active_run_id=$(jq -r '.runId // empty' <<<"$active_claim_content")
          active_pr_number=$(jq -r '.pullRequestNumber // empty' <<<"$active_claim_content")
          active_branch=$(jq -r '.branch // empty' <<<"$active_claim_content")
          if [[ "$active_issue_key" != "$issue_key" || \
                "$active_run_id" != "$claim_run_id" || \
                "$active_pr_number" != "$pr_number" || \
                "$active_branch" != "$head_ref" ]]; then
            echo "::error::Pull request claim is no longer the active factory claim for $issue_key."
            exit 1
          fi

          jira_url="${JIRA_BASE_URL%/}"
          issue_file=$(mktemp)
          trap 'rm -f "$issue_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header 'Accept: application/json' \
            "$jira_url/rest/api/3/issue/$issue_key?fields=project,labels,status" > "$issue_file"

          issue_project=$(jq -r '.fields.project.key // empty' "$issue_file")
          has_factory_label=$(jq -r 'if ((.fields.labels // []) | index("factory")) then "true" else "false" end' "$issue_file")
          current_status_id=$(jq -r '.fields.status.id // empty' "$issue_file")
          current_status_name=$(jq -r '.fields.status.name // empty' "$issue_file")
          current_category=$(jq -r '.fields.status.statusCategory.key // empty' "$issue_file")
          if [[ "$issue_project" != "WOD" || "$has_factory_label" != "true" ]]; then
            echo "::error::Jira $issue_key is not a WOD issue with the exact factory label."
            exit 1
          fi
          if [[ -z "$current_status_id" || -z "$current_category" ]]; then
            echo "::error::Could not verify the current Jira status for $issue_key."
            exit 1
          fi

          is_in_progress=false
          if [[ "$current_status_id" == "$JIRA_IN_PROGRESS_STATUS_ID" ]]; then
            is_in_progress=true
          fi

          if [[ "$target_status" == "In Progress" ]]; then
            if [[ "$is_in_progress" != true ]]; then
              echo "::error::Factory must transition $issue_key to In Progress before this pull-request verification."
              exit 1
            fi
            echo "Verified Jira $issue_key is In Progress for PR #$pr_number; no Jira write performed."
            exit 0
          else
            if [[ "$current_status_id" == "$JIRA_DONE_STATUS_ID" ]]; then
              echo "Verified Jira $issue_key is Done for PR #$pr_number; no Jira write performed."
              exit 0
            fi
            if [[ "$current_category" == "done" ]]; then
              echo "::error::Refusing to treat terminal Jira status '$current_status_name' as Done."
              exit 1
            fi
            if [[ "$is_in_progress" != true ]]; then
              echo "::error::Expected Jira $issue_key to be In Progress before the factory completion transition."
              exit 1
            fi
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Jira $issue_key is not Done; the factory completion transition is still pending."
              exit 1
            fi
            echo "::notice::Verified merged PR #$pr_number and active factory claim for $issue_key; factory must perform the Jira Done transition."
            exit 0
          fi
