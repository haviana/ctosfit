name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check conflict markers and whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- . ':!*.lock'; then
            echo "Merge conflict markers found"
            exit 1
          fi
          git diff --check
      - name: Validate shell scripts when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print)
          if (("${#scripts[@]}" == 0)); then
            echo "No shell scripts found; skipping"
            exit 0
          fi
          bash -n "${scripts[@]}"
      - name: Test the Render deploy script
        shell: bash
        run: bash scripts/render-deploy.test.sh

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Gradle project
        id: gradle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]] || find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project found; backend checks will be skipped."
          fi
      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.present == 'true'
        with:
          gradle-version: '9.7.0'
      - name: Verify Docker for Testcontainers
        if: steps.gradle.outputs.present == 'true'
        run: docker info
      - name: Run Gradle checks
        if: steps.gradle.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            bash ./gradlew check
          else
            gradle check
          fi
      - name: Require the PostgreSQL tenant-isolation suite
        if: steps.gradle.outputs.present == 'true'
        shell: bash
        run: bash scripts/require-tenant-isolation-results.sh

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect frontend project
        id: frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            if [[ ! -f web/package-lock.json ]]; then
              echo "web/package.json exists but web/package-lock.json is missing; npm ci cannot run reproducibly."
              exit 1
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No web npm project found; frontend checks will be skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and verify frontend packages
        if: steps.frontend.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run --if-present lint
          npm test
          npm run build
