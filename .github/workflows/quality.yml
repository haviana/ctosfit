name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check conflict markers and whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- . ':!*.lock'; then
            echo "Merge conflict markers found"
            exit 1
          fi
          git diff --check
      - name: Validate shell scripts when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print)
          if (("${#scripts[@]}" == 0)); then
            echo "No shell scripts found; skipping"
            exit 0
          fi
          bash -n "${scripts[@]}"

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradlew') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./gradlew ]]; then
            ./gradlew check
          else
            echo "Gradle build files exist but ./gradlew is missing."
            exit 1
          fi

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify frontend packages
        run: |
          set -euo pipefail
          npm ci
          npm run --if-present lint
          npm run --if-present test
          npm run --if-present build
