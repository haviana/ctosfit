databases:
  - name: ctosfit-db-dev
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: ctosfit-api-dev
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: CTOSFIT_DATABASE_HOST
        fromDatabase:
          name: ctosfit-db-dev
          property: host
      - key: CTOSFIT_DATABASE_PORT
        fromDatabase:
          name: ctosfit-db-dev
          property: port
      - key: CTOSFIT_DATABASE_NAME
        fromDatabase:
          name: ctosfit-db-dev
          property: database
      - key: CTOSFIT_DATABASE_USERNAME
        fromDatabase:
          name: ctosfit-db-dev
          property: user
      - key: CTOSFIT_DATABASE_PASSWORD
        fromDatabase:
          name: ctosfit-db-dev
          property: password
      - key: CTOSFIT_SECURITY_ISSUER_URI
        sync: false
      - key: CTOSFIT_SECURITY_JWK_SET_URI
        sync: false
      - key: CTOSFIT_SECURITY_AUDIENCE
        sync: false
      - key: CTOSFIT_OIDC_ENABLED
        value: "false"
      - key: CTOSFIT_OIDC_ISSUER_URI
        sync: false
      - key: CTOSFIT_OIDC_CLIENT_ID
        sync: false
      - key: CTOSFIT_OIDC_CLIENT_SECRET
        sync: false
  - type: web
    name: ctosfit-web-dev
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ctosfit-api-dev-jwm1.onrender.com
      - key: VITE_OIDC_ISSUER_URL
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_REDIRECT_URI
        sync: false
