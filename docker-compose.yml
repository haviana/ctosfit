services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ctosfit
      POSTGRES_USER: ctosfit
      POSTGRES_PASSWORD: ctosfit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctosfit -d ctosfit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ctosfit-postgres:/var/lib/postgresql/data

volumes:
  ctosfit-postgres:
