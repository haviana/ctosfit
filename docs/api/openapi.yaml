openapi: 3.1.0
info:
  title: Ctosfit API
  version: 0.1.0
  description: REST API for box-scoped exercises, workout programming, publication and athlete results.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/boxes:
    post:
      summary: Create a box and make the authenticated user its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBox' }
      responses:
        '201':
          description: Created box
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        '400': { description: Invalid box name or time zone }
  /api/box-owner/memberships:
    get:
      summary: List memberships in the authenticated owner's selected box
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      responses:
        '200':
          description: Box-scoped memberships
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        '403': { description: Active owner membership required }
    post:
      summary: Add or reactivate a member in the selected box
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMembership' }
      responses:
        '201':
          description: Active membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { description: Active owner membership required }
  /api/box-owner/memberships/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/SelectedBox'
    patch:
      summary: Change a member's role in the selected box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { $ref: '#/components/schemas/BoxRole' } }
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { description: Active owner membership required or self-demotion denied }
        '404': { description: Membership not found in this box }
        '409': { description: Box must retain at least one active owner }
    delete:
      summary: Deactivate a member in the selected box
      responses:
        '200':
          description: Deactivated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { description: Active owner membership required or self-deactivation denied }
        '404': { description: Membership not found in this box }
        '409': { description: Box must retain at least one active owner }
  /api/coaches/exercises:
    get:
      summary: Search exercises in the selected box
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: query
          in: query
          schema: { type: string }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Box-scoped exercise list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Exercise' } }
        '403': { description: Active coach or owner membership required }
    post:
      summary: Create an exercise
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveExercise' }
      responses:
        '201':
          description: Created exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '400': { description: Invalid exercise }
        '403': { description: Active coach or owner membership required }
  /api/coaches/exercises/{exerciseId}:
    put:
      summary: Update an exercise in the selected box
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveExercise' }
      responses:
        '200':
          description: Updated exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '404': { description: Exercise is not available in this box }
  /api/coaches/exercises/{exerciseId}/archive:
    post:
      summary: Archive an exercise without changing its identity
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: exerciseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archived exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
  /api/coaches/workouts:
    post:
      summary: Create a workout draft
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkout' }
      responses:
        '201':
          description: Saved draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutDraft' }
  /api/coaches/workouts/{workoutId}/title:
    put:
      summary: Rename a box-scoped draft
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties: { title: { type: string, maxLength: 160 } }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutDraft' }
        '404': { description: Draft is not available in this box }
  /api/coaches/workouts/{workoutId}/blocks:
    post:
      summary: Add an ordered block to a draft
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [block]
              properties:
                block: { $ref: '#/components/schemas/WorkoutBlockInput' }
                position: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutDraft' }
  /api/coaches/workouts/{workoutId}/blocks/{blockId}:
    put:
      summary: Replace a block while preserving its ID
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutBlockInput' }
      responses:
        '200': { description: Updated draft }
    delete:
      summary: Remove a block from a draft
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated draft }
  /api/coaches/workouts/{workoutId}/blocks/{blockId}/position:
    patch:
      summary: Move a draft block
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties: { position: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Updated draft }
  /api/coaches/workouts/{workoutId}/publish:
    post:
      summary: Publish an immutable workout version for a date
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: workoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledFor]
              properties: { scheduledFor: { type: string, format: date } }
      responses:
        '200':
          description: Immutable published snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPublication' }
        '400': { description: Invalid workout or unavailable movement }
  /api/athletes/workouts:
    get:
      summary: List published workouts for a box-local date
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Immutable publications scheduled for that date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WorkoutPublication' } }
  /api/athletes/publications/{publicationId}:
    get:
      summary: Read one immutable publication in the selected box
      parameters:
        - $ref: '#/components/parameters/SelectedBox'
        - name: publicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Published workout snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPublication' }
        '404': { description: Publication is not available in this box }
  /api/athletes/results:
    get:
      summary: List the authenticated athlete's results
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      responses:
        '200':
          description: Results for the current athlete and selected box
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WorkoutResult' } }
    post:
      summary: Submit a typed score for a published workout
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitWorkoutResult' }
      responses:
        '201':
          description: Saved result linked to the exact publication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutResult' }
        '400': { description: Invalid score or metric/prescription mismatch }
        '404': { description: Publication is not available in this box }
  /api/athletes/personal-bests:
    get:
      summary: List personal bests for the authenticated athlete
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      responses:
        '200':
          description: Comparable personal bests by metric and prescription
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PersonalBest' } }
  /api/coaches/results:
    get:
      summary: List results for the selected box
      parameters: [{ $ref: '#/components/parameters/SelectedBox' }]
      responses:
        '200':
          description: Box-scoped result list for an authorized coach or owner
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WorkoutResult' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SelectedBox:
      name: X-Box-Id
      in: header
      required: true
      description: Selects a box context; active membership and role are verified server-side.
      schema: { type: string, format: uuid }
  schemas:
    CreateBox:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timeZone: { type: string, maxLength: 100, default: UTC }
    Box:
      type: object
      required: [id, name, timeZone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timeZone: { type: string }
    BoxRole:
      type: string
      enum: [BOX_OWNER, COACH, ATHLETE]
    AddMembership:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, minLength: 1, maxLength: 255 }
        role: { $ref: '#/components/schemas/BoxRole' }
    Membership:
      type: object
      required: [id, userId, boxId, role, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        boxId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/BoxRole' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    SaveExercise:
      type: object
      required: [name, category]
      properties:
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 80 }
        equipment: { type: array, items: { type: string, maxLength: 120 } }
        instructions: { type: [string, 'null'] }
        mediaReference: { type: [string, 'null'] }
    Exercise:
      allOf:
        - $ref: '#/components/schemas/SaveExercise'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            archivedAt: { type: [string, 'null'], format: date-time }
    CreateWorkout:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        blocks: { type: array, items: { $ref: '#/components/schemas/WorkoutBlockInput' } }
    WorkoutBlockInput:
      type: object
      required: [title, intent, movements]
      properties:
        title: { type: string }
        intent: { type: string, enum: [WARM_UP, STRENGTH, CONDITIONING, SKILL, ACCESSORY] }
        format: { $ref: '#/components/schemas/WorkoutFormat' }
        movements: { type: array, items: { $ref: '#/components/schemas/Movement' } }
        instructions: { type: [string, 'null'] }
    WorkoutFormat:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [AMRAP, EMOM, FOR_TIME, TABATA, INTERVALS, ROUNDS_AND_REPS, SETS_AND_REPS, CHIPPER] }
        durationSeconds: { type: integer, minimum: 1 }
        intervalSeconds: { type: integer, minimum: 1 }
        intervalCount: { type: integer, minimum: 1 }
        workSeconds: { type: integer, minimum: 1 }
        restSeconds: { type: integer, minimum: 1 }
        rounds: { type: integer, minimum: 1 }
        sets: { type: integer, minimum: 1 }
        timeCapSeconds: { type: [integer, 'null'], minimum: 1 }
    Movement:
      type: object
      required: [exerciseId, movementName, variants]
      properties:
        exerciseId: { type: string, format: uuid }
        movementName: { type: string }
        variants:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/MovementTarget' }
    MovementTarget:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [REPETITIONS, LOAD, DISTANCE, DURATION, CALORIES] }
        value: { type: string }
        unit: { type: [string, 'null'], enum: [KILOGRAMS, POUNDS, METERS, KILOMETERS, CALORIES, 'null'] }
    WorkoutDraft:
      type: object
      required: [id, title, version, blocks]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        blocks: { type: array, items: { $ref: '#/components/schemas/WorkoutBlock' } }
    WorkoutPublication:
      type: object
      required: [id, workoutId, version, title, scheduledFor, publishedAt, publishedBy, blocks]
      properties:
        id: { type: string, format: uuid }
        workoutId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        scheduledFor: { type: string, format: date }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        blocks: { type: array, items: { $ref: '#/components/schemas/WorkoutBlock' } }
    WorkoutBlock:
      allOf:
        - $ref: '#/components/schemas/WorkoutBlockInput'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    SubmitWorkoutResult:
      type: object
      required: [publicationId, metricId, prescriptionId, score]
      properties:
        publicationId: { type: string, format: uuid }
        metricId: { type: string, format: uuid }
        prescriptionId: { type: string, enum: [RX, SCALED, BEGINNER] }
        score: { $ref: '#/components/schemas/WorkoutScore' }
    WorkoutScore:
      oneOf:
        - type: object
          required: [type, amount, unit]
          properties:
            type: { const: LOAD }
            amount: { type: number, minimum: 0 }
            unit: { type: string, enum: [KILOGRAM, POUND] }
        - type: object
          required: [type, elapsedSeconds, timeOutcome]
          properties:
            type: { const: TIME }
            elapsedSeconds: { type: integer, minimum: 0 }
            timeOutcome: { type: string, enum: [COMPLETED, TIME_CAP, DID_NOT_FINISH] }
        - type: object
          required: [type, reps]
          properties:
            type: { const: REPS }
            reps: { type: integer, minimum: 0 }
        - type: object
          required: [type, rounds, additionalReps]
          properties:
            type: { const: ROUNDS_AND_REPS }
            rounds: { type: integer, minimum: 0 }
            additionalReps: { type: integer, minimum: 0 }
        - type: object
          required: [type, amount, unit]
          properties:
            type: { const: DISTANCE }
            amount: { type: number, minimum: 0 }
            unit: { type: string, enum: [METER, KILOMETER, MILE, FOOT] }
        - type: object
          required: [type, calories]
          properties:
            type: { const: CALORIES }
            calories: { type: integer, minimum: 0 }
        - type: object
          required: [type, completionStatus]
          properties:
            type: { const: COMPLETION }
            completionStatus: { type: string, enum: [COMPLETED, NOT_COMPLETED] }
    WorkoutResult:
      type: object
      required: [id, athleteId, publicationId, metricId, prescriptionId, submittedAt, score]
      properties:
        id: { type: string, format: uuid }
        athleteId: { type: string }
        publicationId: { type: string, format: uuid }
        metricId: { type: string, format: uuid }
        prescriptionId: { type: string }
        submittedAt: { type: string, format: date-time }
        score: { $ref: '#/components/schemas/WorkoutScore' }
    PersonalBest:
      type: object
      required: [metricId, prescriptionId, resultId, achievedAt, score]
      properties:
        metricId: { type: string, format: uuid }
        prescriptionId: { type: string }
        resultId: { type: string, format: uuid }
        achievedAt: { type: string, format: date-time }
        score: { $ref: '#/components/schemas/WorkoutScore' }
